# Application Configuration
spring.application.name=fnol-intake-service
server.port=8080

# H2 Database Configuration (for demo/local development)
spring.datasource.url=jdbc:h2:mem:fnoldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Logging Configuration
logging.level.com.example.herokuDemo1.fnol=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# Security Configuration
# For demo, disable OAuth2 JWT validation by setting issuer to empty
spring.security.oauth2.resourceserver.jwt.issuer-uri=
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=

# Springfox (Swagger) Configuration
springfox.documentation.swagger.v2.path=/v2/api-docs
springfox.documentation.swagger-ui.enabled=true
